services:
  - type: web
    name: wc26-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wc26-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://your-vercel-app-url.vercel.app # TODO: Update with actual frontend URL

databases:
  - name: wc26-db
    databaseName: tournament
    user: tournament_user
    plan: free
